<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Machine Slices — The machine</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;color:#d9d5c7;background:#080f12}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:28px 32px 36px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font-size:17px;font-weight:500;letter-spacing:.08em;margin:0}header p{font-size:12px;color:#87958f;margin:0}canvas{display:block;width:100%;height:auto;border:1px solid #2c3a39}section{padding-top:22px}.transport{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,input{font:inherit;color:inherit;border:1px solid #45524e;border-radius:3px;background:#14201f}button{padding:9px 19px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#2b3e38;border-color:#a28d65}button:focus-visible,input:focus-visible{outline:2px solid #89ddd0;outline-offset:3px}label{font-size:12px;color:#a5afa7}#time{width:112px;margin-left:8px;padding:8px}#scrub{flex:1;min-width:140px;accent-color:#b49462;margin:0 8px}.seed-row{display:flex;align-items:end;gap:10px;margin-top:18px}.seed-row label{flex:1}#seed{display:block;width:100%;margin-top:7px;padding:10px;font:12px ui-monospace,monospace}#status{font-size:12px;color:#b3a17c;min-height:18px;margin-bottom:0}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){main{padding:20px 12px}header{align-items:start;flex-direction:column;gap:7px}#scrub{order:5;flex-basis:100%;margin-top:8px}.seed-row{align-items:stretch;flex-direction:column}}
</style></head>
<body><main><header><h1>MACHINE SLICES</h1><p>01 / The machine &nbsp; · &nbsp; One thousand windows into one organism</p></header>
<canvas id="artwork" width="1000" height="1000" aria-label="Abstract mechanical organism with a paired-gear heart and connected moving organs"></canvas>
<section aria-label="Artwork controls"><div class="transport"><button id="play" type="button" aria-pressed="false">Play</button><button id="pause" type="button" aria-pressed="true">Pause</button><label for="time">Time · ms<input id="time" type="number" min="0" max="60000" step="1" value="0"></label><label for="scrub" class="visually-hidden">Scrub time</label><input id="scrub" type="range" min="0" max="60000" step="1" value="0"></div>
<div class="seed-row"><label for="seed">Preview seed<input id="seed" spellcheck="false" value="0x1111111111111111111111111111111111111111111111111111111111111111"></label><button id="apply-seed" type="button">Apply seed</button></div><p id="status" role="status">Paused</p></section>
<script type="module" src="/dist/viewer.js"></script></main></body></html>
